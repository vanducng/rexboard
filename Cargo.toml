[package]
name = "rexboard"
version = "0.19.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Unofficial attention board for agent panes across Rex hosts"
repository = "https://github.com/vanducng/rexboard"
readme = "README.md"
keywords = ["cli", "tui", "agents", "terminal"]
categories = ["command-line-utilities"]
authors = ["Duc Nguyen <me@vanducng.dev>"]
publish = false

[[bin]]
name = "rexboard"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
tui-input = "0.15"
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
