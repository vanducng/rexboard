# rexboard's settings, kept at $XDG_CONFIG_HOME/rexboard/config.toml (~/.config/rexboard/config.toml).
# Every key is in docs/configuration.md; serve reads the file when it starts.

# A row is marked (a * before its number) when any [[mark]] rule matches it. Every key of one rule
# must match, and a value is a label or a glob (* any run, ? one character). `'` goes to a marked
# row, `f*` keeps only them, and rexboard board --once --status marked opens on them.
# See docs/configuration.md#mark and docs/tui.md#marked-rows.

# Seats by label: every pane labelled seat-<anything>.
[[mark]]
block = "seat-*"

# A field an extension reports (examples/extensions/session-prefix gives each row its project), on one host.
[[mark]]
host = "studio"
field."session-prefix.project" = "api"
