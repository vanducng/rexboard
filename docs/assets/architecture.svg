<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
        <title id="architecture-title">rexboard architecture</title>
        <desc id="architecture-desc">Two Rex hosts, studio and mini, each stream one observer to rexboard serve, which keeps state on disk and answers ls, watch, seen and the board over a unix socket; a jump runs jump.pre_cmd, focuses the pane on its host and asks the Rex app to select its session, then marks it seen.</desc>
