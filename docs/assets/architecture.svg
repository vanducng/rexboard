<svg id="architecture" viewBox="0 0 1080 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">rexboard architecture</title>
  <desc id="architecture-desc">Agents report their state to Rex: Claude Code, Codex, pi and grok on their own in a Rex pane, or through a hook inside tmux. On this host and on every host in rex hosts, Rex runs rexboard's observer.lua, which streams NDJSON to rexboard serve. serve keeps one observer per host, one reducer, the harness adapters and state on disk, and runs the extensions, which read rows and give fields. The board, pick and the CLI (ls, watch, show, seen) read serve's rows over its socket. Three things write to Rex, each on one pane you chose, from the board or the CLI: a jump, an answer and a close act on the pane's host, and a jump then asks the Rex app to show the pane.</desc>
  <defs>
    <style>
    #architecture { --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #5f6b80; --accent: #eb6c36; --accent-tint: rgba(235,108,54,0.08); --link: #2e5aa8; --box: #ffffff; --wash: rgba(45,49,66,0.03); --wash2: rgba(45,49,66,0.05); --line: rgba(45,49,66,0.30); --zone-fill: rgba(45,49,66,0.02); --zone-stroke: rgba(45,49,66,0.12); }
    @media (prefers-color-scheme: dark) { #architecture { --paper: #2d3142; --ink: #f5f5f5; --muted: #bfc0c0; --soft: #a6adbb; --accent: #f08a59; --accent-tint: rgba(240,138,89,0.12); --link: #7aa5e6; --box: #393e53; --wash: rgba(245,245,245,0.04); --wash2: rgba(245,245,245,0.06); --line: rgba(245,245,245,0.32); --zone-fill: rgba(245,245,245,0.02); --zone-stroke: rgba(245,245,245,0.14); } }
    #architecture .bg, #architecture .mask { fill: var(--paper); }
    #architecture .zone { fill: var(--zone-fill); stroke: var(--zone-stroke); stroke-width: 1; }
    #architecture .zlabel { fill: var(--soft); font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.12em; }
    #architecture .external { fill: var(--wash); stroke: var(--line); stroke-width: 1; }
    #architecture .focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.5; }
    #architecture .backend { fill: var(--box); stroke: var(--ink); stroke-width: 1; }
    #architecture .store { fill: var(--wash2); stroke: var(--muted); stroke-width: 1; }
    #architecture .title { fill: var(--ink); font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    #architecture .title-mono { fill: var(--ink); font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    #architecture .sub { fill: var(--muted); font: 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    #architecture .sub-mono { fill: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    #architecture .edge { fill: none; stroke: var(--muted); stroke-width: 1; }
    #architecture .jump { fill: none; stroke: var(--link); stroke-width: 2; }
    #architecture .elabel { fill: var(--soft); font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.04em; }
    #architecture .elabel-jump { fill: var(--link); font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.04em; }
    #architecture .legend { fill: var(--ink); font: 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    #architecture .legend-head { fill: var(--soft); font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.12em; }
    #architecture .rule { stroke: var(--zone-stroke); stroke-width: 1; }
    #architecture .caption { fill: var(--ink); font: 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    #architecture .swatch { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.5; }
    #architecture .head-muted { fill: var(--muted); }
    #architecture .head-link { fill: var(--link); }
  </style>
