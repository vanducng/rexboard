<svg id="architecture" viewBox="0 0 1040 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">rexboard architecture</title>
  <desc id="architecture-desc">Two Rex hosts, local (this Mac) and mini, each stream one observer to rexboard serve, which keeps state on disk and answers ls, watch, seen and the board over a unix socket. A jump is the one write to Rex: it runs jump.pre_cmd, focuses the pane on its host and asks the Rex app to show its session.</desc>
  <defs>
    <style>
    #architecture { --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #5f6b80; --accent: #eb6c36; --accent-tint: rgba(235,108,54,0.08); --link: #2e5aa8; --box: #ffffff; --wash: rgba(45,49,66,0.03); --wash2: rgba(45,49,66,0.05); --line: rgba(45,49,66,0.30); --zone-fill: rgba(45,49,66,0.02); --zone-stroke: rgba(45,49,66,0.12); }
    @media (prefers-color-scheme: dark) { #architecture { --paper: #2d3142; --ink: #f5f5f5; --muted: #bfc0c0; --soft: #a6adbb; --accent: #f08a59; --accent-tint: rgba(240,138,89,0.12); --link: #7aa5e6; --box: #393e53; --wash: rgba(245,245,245,0.04); --wash2: rgba(245,245,245,0.06); --line: rgba(245,245,245,0.32); --zone-fill: rgba(245,245,245,0.02); --zone-stroke: rgba(245,245,245,0.14); } }
    #architecture .bg, #architecture .mask { fill: var(--paper); }
    #architecture .zone { fill: var(--zone-fill); stroke: var(--zone-stroke); stroke-width: 1; }
    #architecture .zlabel { fill: var(--soft); font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.12em; }
    #architecture .external { fill: var(--wash); stroke: var(--line); stroke-width: 1; }
    #architecture .focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.5; }
    #architecture .backend { fill: var(--box); stroke: var(--ink); stroke-width: 1; }
    #architecture .store { fill: var(--wash2); stroke: var(--muted); stroke-width: 1; }
    #architecture .optional { fill: var(--wash); stroke: var(--line); stroke-width: 1; stroke-dasharray: 5 4; }
    #architecture .title { fill: var(--ink); font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    #architecture .title-mono { fill: var(--ink); font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    #architecture .sub { fill: var(--muted); font: 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    #architecture .sub-mono { fill: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    #architecture .edge { fill: none; stroke: var(--muted); stroke-width: 1; }
    #architecture .jump { fill: none; stroke: var(--link); stroke-width: 2; }
    #architecture .dashed { stroke-dasharray: 5 4; }
    #architecture .elabel { fill: var(--soft); font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.04em; }
    #architecture .elabel-jump { fill: var(--link); font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.04em; }
    #architecture .legend { fill: var(--ink); font: 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    #architecture .legend-head { fill: var(--soft); font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.12em; }
    #architecture .rule { stroke: var(--zone-stroke); stroke-width: 1; }
    #architecture .caption { fill: var(--ink); font: 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    #architecture .swatch { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.5; }
    #architecture .head-muted { fill: var(--muted); }
    #architecture .head-link { fill: var(--link); }
  </style>
    <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head-muted" points="0 0, 8 3, 0 6"/></marker>
    <marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head-link" points="0 0, 8 3, 0 6"/></marker>
  </defs>
  <rect class="bg" width="100%" height="100%"/>
    <rect class="zone" x="32" y="64" width="264" height="448" rx="8"/>
    <rect class="mask" x="48" y="56" width="40" height="16" rx="2"/>
    <text class="zlabel" x="68" y="68" text-anchor="middle">REX</text>
    <rect class="zone" x="328" y="64" width="680" height="320" rx="8"/>
    <rect class="mask" x="344" y="56" width="80" height="16" rx="2"/>
    <text class="zlabel" x="384" y="68" text-anchor="middle">REXBOARD</text>
    <line class="edge" x1="280" y1="128" x2="360" y2="128" marker-end="url(#architecture-arrow)"/>
    <rect class="mask" x="292" y="106" width="56" height="14" rx="2"/>
    <text class="elabel" x="320" y="117" text-anchor="middle">NDJSON</text>
    <path class="edge" d="M280,240 H312 Q320,240 320,232 V184 Q320,176 328,176 H360" marker-end="url(#architecture-arrow)"/>
    <line class="edge" x1="480" y1="200" x2="480" y2="256" marker-end="url(#architecture-arrow)"/>
    <rect class="mask" x="488" y="221" width="40" height="14" rx="2"/>
    <text class="elabel" x="508" y="232" text-anchor="middle">SAVE</text>
    <line class="edge" x1="600" y1="120" x2="728" y2="120" marker-end="url(#architecture-arrow)"/>
    <rect class="mask" x="620" y="98" width="88" height="14" rx="2"/>
    <text class="elabel" x="664" y="109" text-anchor="middle">UNIX SOCKET</text>
    <path class="edge" d="M600,152 H680 Q688,152 688,160 V208 Q688,216 696,216 H728" marker-end="url(#architecture-arrow)"/>
    <line class="edge" x1="852" y1="248" x2="852" y2="296" marker-end="url(#architecture-arrow)"/>
    <rect class="mask" x="860" y="265" width="48" height="14" rx="2"/>
    <text class="elabel" x="884" y="276" text-anchor="middle">ENTER</text>
    <path class="edge" d="M728,312 H648 Q640,312 640,304 V192 Q640,184 632,184 H600" marker-end="url(#architecture-arrow)"/>
    <rect class="mask" x="648" y="262" width="88" height="14" rx="2"/>
    <text class="elabel" x="692" y="273" text-anchor="middle">ROWS · SEEN</text>
    <line class="jump" x1="852" y1="360" x2="852" y2="440" marker-end="url(#architecture-arrow-link)"/>
    <rect class="mask" x="860" y="393" width="76" height="14" rx="2"/>
    <text class="elabel-jump" x="898" y="404" text-anchor="middle">1 PRE_CMD</text>
    <line class="jump dashed" x1="728" y1="456" x2="280" y2="456" marker-end="url(#architecture-arrow-link)"/>
    <rect class="mask" x="456" y="434" width="96" height="14" rx="2"/>
    <text class="elabel-jump" x="504" y="445" text-anchor="middle">FOCUS WINDOW</text>
    <path class="jump" d="M728,352 H208 Q200,352 200,344 V272" marker-end="url(#architecture-arrow-link)"/>
    <rect class="mask" x="366" y="330" width="108" height="14" rx="2"/>
    <text class="elabel-jump" x="420" y="341" text-anchor="middle">2 ATTACH+FOCUS</text>
    <line class="jump" x1="104" y1="272" x2="104" y2="424" marker-end="url(#architecture-arrow-link)"/>
    <rect class="mask" x="112" y="372" width="68" height="14" rx="2"/>
    <text class="elabel-jump" x="146" y="383" text-anchor="middle">3 SELECT</text>
    <rect class="mask" x="48" y="96" width="232" height="64" rx="6"/>
    <rect class="external" x="48" y="96" width="232" height="64" rx="6"/>
    <text class="title" x="164" y="124" text-anchor="middle">local</text>
    <text class="sub-mono" x="164" y="143" text-anchor="middle">this Mac · rex do - --all</text>
    <rect class="mask" x="48" y="208" width="232" height="64" rx="6"/>
    <rect class="external" x="48" y="208" width="232" height="64" rx="6"/>
    <text class="title" x="164" y="236" text-anchor="middle">mini</text>
    <text class="sub-mono" x="164" y="255" text-anchor="middle">remote · rex -S mini do - --all</text>
    <rect class="mask" x="48" y="424" width="232" height="64" rx="6"/>
    <rect class="external" x="48" y="424" width="232" height="64" rx="6"/>
    <text class="title" x="164" y="452" text-anchor="middle">Rex app</text>
    <text class="sub" x="164" y="471" text-anchor="middle">this Mac's main window</text>
    <rect class="mask" x="360" y="104" width="240" height="96" rx="6"/>
    <rect class="focal" x="360" y="104" width="240" height="96" rx="6"/>
    <text class="title" x="480" y="148" text-anchor="middle">rexboard serve</text>
    <text class="sub" x="480" y="167" text-anchor="middle">one observer per host · keeps state</text>
    <rect class="mask" x="360" y="256" width="240" height="64" rx="6"/>
    <rect class="store" x="360" y="256" width="240" height="64" rx="6"/>
    <text class="title" x="480" y="284" text-anchor="middle">state on disk</text>
    <text class="sub-mono" x="480" y="303" text-anchor="middle">state.json · transitions.jsonl</text>
    <rect class="mask" x="728" y="88" width="248" height="64" rx="6"/>
    <rect class="backend" x="728" y="88" width="248" height="64" rx="6"/>
    <text class="title-mono" x="852" y="116" text-anchor="middle">ls · watch · seen</text>
    <text class="sub" x="852" y="135" text-anchor="middle">one request per line</text>
    <rect class="mask" x="728" y="184" width="248" height="64" rx="6"/>
    <rect class="backend" x="728" y="184" width="248" height="64" rx="6"/>
    <text class="title-mono" x="852" y="212" text-anchor="middle">board · pick</text>
    <text class="sub" x="852" y="231" text-anchor="middle">subscribes to rows</text>
    <rect class="mask" x="728" y="296" width="248" height="64" rx="6"/>
    <rect class="focal" x="728" y="296" width="248" height="64" rx="6"/>
    <text class="title-mono" x="852" y="324" text-anchor="middle">jump · next</text>
    <text class="sub" x="852" y="343" text-anchor="middle">focus the pane · select its session</text>
    <rect class="mask" x="728" y="440" width="248" height="64" rx="6"/>
    <rect class="optional" x="728" y="440" width="248" height="64" rx="6"/>
    <text class="title-mono" x="852" y="468" text-anchor="middle">jump.pre_cmd</text>
    <text class="sub" x="852" y="487" text-anchor="middle">your command: focus the main window</text>
    <line class="rule" x1="32" y1="528" x2="1008" y2="528"/>
    <text class="legend-head" x="32" y="552">LEGEND</text>
    <line class="edge" x1="112" y1="548" x2="144" y2="548" marker-end="url(#architecture-arrow)"/>
    <text class="legend" x="152" y="552">reads; nothing here writes to Rex</text>
    <line class="jump" x1="384" y1="548" x2="416" y2="548" marker-end="url(#architecture-arrow-link)"/>
    <text class="legend" x="424" y="552">a jump, the one write</text>
    <line class="edge dashed" x1="608" y1="548" x2="640" y2="548" marker-end="url(#architecture-arrow)"/>
    <text class="legend" x="648" y="552">optional</text>
    <rect class="swatch" x="736" y="541" width="20" height="14" rx="2"/>
    <text class="legend" x="764" y="552">focal: serve and jumps</text>
    <text class="caption" x="32" y="588">rexboard only reads Rex. The one write is a jump (blue): it focuses the pane on its host and asks the Rex app to show it.</text>
    <text class="caption" x="32" y="608">A pane on local takes the same path through its own server.</text>
</svg>
