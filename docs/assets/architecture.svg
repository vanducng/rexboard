    <svg id="architecture" viewBox="0 0 960 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">rexboard architecture</title>
      <desc id="architecture-desc">Agents report their state to Rex, on their own in a Rex pane or through rexboard hook in tmux. Rex on every host streams it to rexboard serve, which keeps state on disk, runs the extensions and feeds the board, pick and the CLI. Those act on one pane you chose through Rex, and a jump asks the Rex app to show it.</desc>
      <defs>
        <style>
        #architecture { --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #5f6b80; --accent: #eb6c36; --accent-tint: rgba(235,108,54,0.08); --box: #ffffff; --wash: rgba(45,49,66,0.03); --wash2: rgba(45,49,66,0.05); --line: rgba(45,49,66,0.30); --zone-fill: rgba(45,49,66,0.02); --zone-stroke: rgba(45,49,66,0.14); }
        @media (prefers-color-scheme: dark) { #architecture { --paper: #2d3142; --ink: #f5f5f5; --muted: #bfc0c0; --soft: #a6adbb; --accent: #f08a59; --accent-tint: rgba(240,138,89,0.12); --box: #393e53; --wash: rgba(245,245,245,0.04); --wash2: rgba(245,245,245,0.06); --line: rgba(245,245,245,0.32); --zone-fill: rgba(245,245,245,0.02); --zone-stroke: rgba(245,245,245,0.16); } }
        #architecture .bg, #architecture .mask { fill: var(--paper); }
        #architecture .zone { fill: var(--zone-fill); stroke: var(--zone-stroke); stroke-width: 1; }
        #architecture .zlabel { fill: var(--soft); font: 500 9px 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.14em; }
        #architecture .node { stroke-width: 1; }
        #architecture .external { fill: var(--wash); stroke: var(--line); }
        #architecture .backend { fill: var(--box); stroke: var(--ink); }
        #architecture .store { fill: var(--wash2); stroke: var(--muted); }
        #architecture .focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.5; }
        #architecture .name { fill: var(--ink); font: 600 12px 'Geist', ui-sans-serif, system-ui, sans-serif; }
        #architecture .sub { fill: var(--muted); font: 400 9px 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
        #architecture .alabel { fill: var(--soft); font: 400 8px 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.06em; }
        #architecture .arrow { fill: none; stroke: var(--muted); stroke-width: 1.2; }
        #architecture .write { stroke: var(--accent); stroke-width: 1.4; }
        #architecture .dash { stroke-dasharray: 4 3; stroke-width: 1; }
        #architecture .rule { stroke: var(--zone-stroke); stroke-width: 0.8; }
        #architecture .legend { fill: var(--muted); font: 400 8px 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
        #architecture .legend-head { fill: var(--muted); font: 400 8px 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.14em; }
        #architecture .m-arrow { fill: var(--muted); }
        #architecture .m-accent { fill: var(--accent); }
        </style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="m-arrow" points="0 0, 8 3, 0 6"/></marker>
        <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon class="m-arrow" points="0 0, 8 3, 0 6"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="m-accent" points="0 0, 8 3, 0 6"/></marker>
      </defs>
      <rect class="bg" width="100%" height="100%"/>
      <rect class="zone" x="272" y="56" width="208" height="336" rx="8"/>
      <rect class="mask" x="280" y="50" width="36" height="14" rx="2"/>
      <text class="zlabel" x="286" y="61">REX</text>
      <rect class="zone" x="520" y="56" width="416" height="336" rx="8"/>
      <rect class="mask" x="528" y="50" width="72" height="14" rx="2"/>
      <text class="zlabel" x="534" y="61">REXBOARD</text>
      <path class="arrow" d="M208,120 H296" marker-end="url(#arrow)"/>
      <rect class="mask" x="234" y="100" width="36" height="12" rx="2"/><text class="alabel" x="252" y="109" text-anchor="middle">STATUS</text>
      <path class="arrow dash" d="M128,184 V272" marker-end="url(#arrow)"/>
      <rect class="mask" x="136" y="222" width="36" height="12" rx="2"/><text class="alabel" x="154" y="231" text-anchor="middle">HOOKS</text>
      <path class="arrow dash" d="M208,304 H244 Q252,304 252,296 V160 Q252,152 260,152 H296" marker-end="url(#arrow)"/>
      <rect class="mask" x="234" y="222" width="36" height="12" rx="2"/><text class="alabel" x="252" y="231" text-anchor="middle">STATUS</text>
      <path class="arrow dash" d="M128,368 V412 Q128,420 136,420 H616 Q624,420 624,412 V368" marker-end="url(#arrow)"/>
      <rect class="mask" x="338" y="414" width="76" height="12" rx="2"/><text class="alabel" x="376" y="423" text-anchor="middle">USAGE RECORDS</text>
      <path class="arrow" d="M456,120 H544" marker-end="url(#arrow)"/>
      <rect class="mask" x="482" y="100" width="36" height="12" rx="2"/><text class="alabel" x="500" y="109" text-anchor="middle">NDJSON</text>
      <path class="arrow" d="M704,120 H752" marker-end="url(#arrow)"/>
      <rect class="mask" x="710" y="100" width="36" height="12" rx="2"/><text class="alabel" x="728" y="109" text-anchor="middle">SOCKET</text>
      <path class="arrow" d="M592,184 V272" marker-end="url(#arrow)"/>
      <rect class="mask" x="600" y="222" width="36" height="12" rx="2"/><text class="alabel" x="618" y="231" text-anchor="middle">STATE</text>
      <path class="arrow" d="M672,184 V224 Q672,232 680,232 H808 Q816,232 816,240 V272" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
      <rect class="mask" x="706" y="212" width="76" height="12" rx="2"/><text class="alabel" x="744" y="221" text-anchor="middle">ROWS · FIELDS</text>
      <path class="arrow dash" d="M872,184 V272" marker-end="url(#arrow)"/>
      <rect class="mask" x="880" y="222" width="48" height="12" rx="2"/><text class="alabel" x="904" y="231" text-anchor="middle">ACTIONS</text>
      <path class="arrow write" d="M832,88 V40 Q832,32 824,32 H432 Q424,32 424,40 V88" marker-end="url(#arrow-accent)"/>
      <rect class="mask" x="590" y="12" width="76" height="12" rx="2"/><text class="alabel" x="628" y="21" text-anchor="middle">ACT ON A PANE</text>
      <path class="arrow write" d="M376,184 V272" marker-end="url(#arrow-accent)"/>
      <rect class="mask" x="384" y="222" width="80" height="12" rx="2"/><text class="alabel" x="424" y="231" text-anchor="middle">SHOW THE PANE</text>
      <rect class="mask" x="48" y="88" width="160" height="96" rx="6"/>
      <rect class="node external" x="48" y="88" width="160" height="96" rx="6"/>
      <text class="name" x="128" y="115" text-anchor="middle">Agents</text>
      <text class="sub" x="128" y="136" text-anchor="middle">Claude Code · Codex</text>
      <text class="sub" x="128" y="150" text-anchor="middle">pi · grok</text>
      <text class="sub" x="128" y="164" text-anchor="middle">in a Rex pane or in tmux</text>
      <rect class="mask" x="48" y="272" width="160" height="96" rx="6"/>
      <rect class="node backend" x="48" y="272" width="160" height="96" rx="6"/>
      <text class="name" x="128" y="299" text-anchor="middle">rexboard hook</text>
      <text class="sub" x="128" y="320" text-anchor="middle">for tmux and pi</text>
      <text class="sub" x="128" y="334" text-anchor="middle">status to Rex</text>
      <text class="sub" x="128" y="348" text-anchor="middle">plus rexboard usage</text>
      <rect class="mask" x="296" y="88" width="160" height="96" rx="6"/>
      <rect class="node external" x="296" y="88" width="160" height="96" rx="6"/>
      <text class="name" x="376" y="122" text-anchor="middle">Rex, every host</text>
      <text class="sub" x="376" y="143" text-anchor="middle">observer.lua</text>
      <text class="sub" x="376" y="157" text-anchor="middle">rex do · rex -S HOST</text>
      <rect class="mask" x="296" y="272" width="160" height="96" rx="6"/>
      <rect class="node external" x="296" y="272" width="160" height="96" rx="6"/>
      <text class="name" x="376" y="306" text-anchor="middle">Rex app</text>
      <text class="sub" x="376" y="327" text-anchor="middle">this Mac</text>
      <text class="sub" x="376" y="341" text-anchor="middle">the focused window</text>
      <rect class="mask" x="544" y="88" width="160" height="96" rx="6"/>
      <rect class="node focal" x="544" y="88" width="160" height="96" rx="6"/>
      <text class="name" x="624" y="115" text-anchor="middle">rexboard serve</text>
      <text class="sub" x="624" y="136" text-anchor="middle">observer per host</text>
      <text class="sub" x="624" y="150" text-anchor="middle">reducer · adapters</text>
      <text class="sub" x="624" y="164" text-anchor="middle">extension runner</text>
      <rect class="mask" x="752" y="88" width="160" height="96" rx="6"/>
      <rect class="node backend" x="752" y="88" width="160" height="96" rx="6"/>
      <text class="name" x="832" y="115" text-anchor="middle">Clients</text>
      <text class="sub" x="832" y="136" text-anchor="middle">board · popup · pick</text>
      <text class="sub" x="832" y="150" text-anchor="middle">CLI: ls · watch · show</text>
      <text class="sub" x="832" y="164" text-anchor="middle">jump · answer · close</text>
      <rect class="mask" x="544" y="272" width="160" height="96" rx="6"/>
      <rect class="node store" x="544" y="272" width="160" height="96" rx="6"/>
      <text class="name" x="624" y="299" text-anchor="middle">State dir</text>
      <text class="sub" x="624" y="320" text-anchor="middle">state.json · usage/</text>
      <text class="sub" x="624" y="334" text-anchor="middle">favorites.json</text>
      <text class="sub" x="624" y="348" text-anchor="middle">tui · pick · board.json</text>
      <rect class="mask" x="752" y="272" width="160" height="96" rx="6"/>
      <rect class="node external" x="752" y="272" width="160" height="96" rx="6"/>
      <text class="name" x="832" y="299" text-anchor="middle">Extensions</text>
      <text class="sub" x="832" y="320" text-anchor="middle">any tool</text>
      <text class="sub" x="832" y="334" text-anchor="middle">rows in, fields out</text>
      <text class="sub" x="832" y="348" text-anchor="middle">actions on a key</text>
      <line class="rule" x1="24" y1="448" x2="936" y2="448"/>
      <text class="legend-head" x="24" y="472">LEGEND</text>
      <path class="arrow" d="M96,468 H132" marker-end="url(#arrow)"/>
      <text class="legend" x="140" y="471">reads</text>
      <path class="arrow write" d="M212,468 H248" marker-end="url(#arrow-accent)"/>
      <text class="legend" x="256" y="471">writes to a pane you chose</text>
      <path class="arrow dash" d="M424,468 H460" marker-end="url(#arrow)"/>
      <text class="legend" x="468" y="471">optional path</text>
      <rect class="node focal" x="632" y="461" width="20" height="14" rx="3"/>
      <text class="legend" x="660" y="471">focal</text>
      <rect class="node external" x="716" y="461" width="20" height="14" rx="3"/>
      <text class="legend" x="744" y="471">outside rexboard</text>
      <rect class="node store" x="852" y="461" width="20" height="14" rx="3"/>
      <text class="legend" x="880" y="471">on disk</text>
    </svg>
